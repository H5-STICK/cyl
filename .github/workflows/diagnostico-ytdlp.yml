name: Diagnostico HLS La 7

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar HLS y calidades
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          pagina = (
              "https://www.cyltvplay.es/player/"
              "d3badef6-d229-4a27-9609-03df3d17ca3/la7/la7"
          )

          def obtener(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.read().decode(
                      "utf-8", errors="replace"
                  )

          estado, html = obtener(pagina)
          print("HTML:", estado)

          match = re.search(
              r"""var\s+m3u8\s*=\s*['"]([^'"]+)['"]""",
              html
          )
          if not match:
              raise SystemExit("No se encontro la URL HLS")

          master = match.group(1)
          if urlsplit(master).hostname != "la7live.flumotion.cloud":
              raise SystemExit("Servidor inesperado")

          estado, lista = obtener(master)
          print("Master HLS:", estado)

          if not lista.startswith("#EXTM3U"):
              raise SystemExit("Respuesta HLS no valida")

          variantes = [
              linea.strip()
              for linea in lista.splitlines()
              if linea.strip()
              and not linea.startswith("#")
          ]

          print("Variantes encontradas:", len(variantes))

          for i, variante in enumerate(variantes, 1):
              url = urljoin(master, variante)
              if urlsplit(url).hostname != "la7live.flumotion.cloud":
                  raise SystemExit("Servidor de variante inesperado")

              estado, contenido = obtener(url)
              if not contenido.startswith("#EXTM3U"):
                  raise SystemExit("Variante HLS no valida")

              print(f"Variante {i}: HTTP {estado}")

          print("DIAGNOSTICO COMPLETADO")
          PY
