name: Diagnostico URL La 7

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar URL en HTML oficial
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urlsplit

          pagina = (
              "https://www.cyltvplay.es/player/"
              "d3badef6-d229-4a27-9609-03df3d17ca3/la7/la7"
          )

          req = urllib.request.Request(
              pagina,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              html = r.read().decode("utf-8", errors="replace")
              print("HTML HTTP:", r.status)

          patron = r"""var\s+m3u8\s*=\s*['"]([^'"]+)['"]"""
          coincidencia = re.search(patron, html)

          if not coincidencia:
              raise SystemExit("No se encontró var m3u8")

          url = coincidencia.group(1)
          partes = urlsplit(url)

          print("URL HLS encontrada: SI")
          print("Servidor:", partes.hostname)
          print("Contiene fmt_token:", "/fmt_token/" in partes.path)
          print("Termina en playlist.m3u8:",
                partes.path.endswith("/playlist.m3u8"))

          if partes.hostname != "la7live.flumotion.cloud":
              raise SystemExit("Servidor HLS inesperado")
          PY
