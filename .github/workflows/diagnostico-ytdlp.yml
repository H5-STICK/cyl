name: Verificar renovacion La 7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar token y HLS
        shell: bash
        run: |
          python - <<'PY'
          import re
          import json
          import base64
          import datetime
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          pagina = (
              "https://www.cyltvplay.es/player/"
              "d3badef6-d229-4a27-9609-03df3d17ca3/la7/la7"
          )

          def obtener(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.read().decode(
                      "utf-8", errors="replace"
                  )

          estado, html = obtener(pagina)
          print("Pagina oficial:", estado)

          match = re.search(
              r"""var\s+m3u8\s*=\s*['"]([^'"]+)['"]""",
              html
          )
          if not match:
              raise SystemExit("URL HLS no encontrada")

          master = match.group(1)
          partes = urlsplit(master)
          if partes.hostname != "la7live.flumotion.cloud":
              raise SystemExit("Servidor HLS inesperado")

          segmentos = partes.path.split("/")
          indice = segmentos.index("fmt_token")
          payload = segmentos[indice + 2]

          payload += "=" * (-len(payload) % 4)
          datos = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          caducidad = int(datos["expire"])
          fecha = datetime.datetime.fromtimestamp(
              caducidad, datetime.timezone.utc
          )

          ahora = datetime.datetime.now(
              datetime.timezone.utc
          )

          print("Caducidad UTC:", fecha.isoformat())
          print("Token vigente:", caducidad > ahora.timestamp())
          print("Token posterior al anterior:",
                caducidad > 1795421743)

          estado, lista = obtener(master)
          if not lista.startswith("#EXTM3U"):
              raise SystemExit("Master HLS invalido")
          print("Master HLS:", estado)

          variantes = [
              linea.strip()
              for linea in lista.splitlines()
              if linea.strip() and not linea.startswith("#")
          ]

          for i, variante in enumerate(variantes, 1):
              url = urljoin(master, variante)
              if urlsplit(url).hostname != partes.hostname:
                  raise SystemExit("Servidor inesperado")

              estado, contenido = obtener(url)
              if not contenido.startswith("#EXTM3U"):
                  raise SystemExit("Variante HLS invalida")
              print(f"Variante {i}: HTTP {estado}")

          print("DIAGNOSTICO COMPLETADO")
          PY
