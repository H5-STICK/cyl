
name: Diagnostico yt-dlp CyLTV

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Analizar reproductor La 7
        run: |
          yt-dlp \
            --ignore-config \
            --no-cache-dir \
            --simulate \
            --list-formats \
            --verbose \
            "https://www.cyltvplay.es/player/d3badef6-d229-4a27-9609-03df3d17ca3/la7/la7"
